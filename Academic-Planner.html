  <main class="container">
    <h2 class="section-title">Academic Planner</h2>
    <p style="margin-bottom:1rem;">Add tasks, mark them complete, or delete them. Tasks are saved automatically.</p>

    <form class="planner-form" id="task-form">
      <input type="text" id="task-input" placeholder="Enter a task..." maxlength="80" required>
      <select id="task-priority">
        <option value="Low">Low priority</option>
        <option value="Medium" selected>Medium priority</option>
        <option value="High">High priority</option>
      </select>
      <button type="submit" class="btn">Add Task</button>
    </form>

    <p id="task-count" class="task-meta"></p>
    <ul class="task-list" id="task-list" aria-live="polite"></ul>
    <p class="empty-msg" id="empty-msg">No tasks yet. Add one above to get started!</p>
  </main>
